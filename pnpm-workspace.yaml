# Build scripts: allow only what each runtime needs; rest false so
# strictDepBuilds (pnpm >=10.26 / 11) passes.
allowBuilds:
  esbuild: true
  workerd: true
  # The bench renderer (plan 5), git-pinned to ndb commit 2575f95c. pnpm keys a
  # git-hosted package by its full tarball URL; its prepare rebuilds dist/ (tsc) from
  # the sources committed in that repo, so the pin builds what it pins.
  "@jandira-tech/bench-viewer@https://codeload.github.com/jandira-tech/neurotic_docx_bench/tar.gz/d12621a34bb5267009291b10676b341b6e401547#path:packages/bench-viewer": true
  better-sqlite3: false
  sharp: false

# Supply-chain hardening: cooldown on brand-new releases (EmDash exempt)
# and no non-registry transitive sources. (No trustPolicy: no-downgrade --
# it trips on upstream provenance regressions we don't control.)
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - emdash
  - "@emdash-cms/*"
  # the owner's own package; 0.17.0 pinned exactly (benchmarks-law#56)
  - jubarte-wasm
blockExoticSubdeps: true

# @astrojs/astro2tsx (pulled by @astrojs/check) depends on @emnapi/core@1.11.3.
# Its @napi-rs/wasm-runtime peer accepts either 1.11.x or 2.0.0-beta, and peer
# dedupe was binding it to Rolldown's @emnapi/runtime@2.0.0-beta.2. That pair
# crashes astro check (setLastError / deleteEnv missing). A direct dependency
# keeps the check stack on the runtime that matches its core.
packageExtensions:
  "@astrojs/astro2tsx@0.1.3":
    dependencies:
      "@emnapi/runtime": 1.11.3
